<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>North Star House Kiosk</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Simple icon components
    const ArrowLeft = () => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    );

    const Clock = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    );

    const Users = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
    );

    const ClipboardList = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <rect x="8" y="2" width="8" height="4" rx="1"></rect>
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
        <line x1="12" y1="11" x2="12" y2="11"></line>
        <line x1="12" y1="16" x2="12" y2="16"></line>
      </svg>
    );

    const NorthStarKiosk = () => {
      const [screen, setScreen] = useState('main');
      const [selectedDuty, setSelectedDuty] = useState(null);
      const [selectedVolunteer, setSelectedVolunteer] = useState(null);
      const [customName, setCustomName] = useState('');
      const [guestData, setGuestData] = useState({ name: '', guests: 1, email: '', joinList: false });
      const [logs, setLogs] = useState([]);
      const [selectedVolunteerForHours, setSelectedVolunteerForHours] = useState(null);
      const [commentText, setCommentText] = useState('');

      const VOLUNTEER_SHEET_URL = 'https://script.google.com/macros/s/AKfycbx1ZvVPUBqBMSPIZIjT-4cm_xwosGexpS9V42d4TbHcuH-5cLW1RkDM4NlbD9CmCvN3/exec';
      const GUEST_FEEDBACK_SHEET_URL = 'https://script.google.com/macros/s/AKfycbwfjQ8JGFwq8STTO2LBIdk1OieByeuNy3G4hYb-wErG3NDvilkxEXqmjgKJfqKJSJBD/exec';

      const dutyAreas = {
        construction: ['Bec Freeman', 'Tom Milam', 'Andy Wright', 'Gary Emanuel', 'Mike French', 'Desert Powell', 'Dennis Westcot', 'Jim Borrelli', 'Mark Hermes', 'Chuck Carroll', 'Paul Nolan', 'Mike Frasu', 'Larry Joseph', 'Joe Keeper', 'Louis Viani', 'Don Bartlett', 'Bob Parker', 'Vince LoFranco'],
        board: ['Paula Campbell', 'Wyn Spiller', 'Ken Underwood', 'Rick Panos', 'David Wright', 'Jeff Cereghino', 'Rich Hill'],
        landscape: ['Mike Frasu', 'Nadine Kapper', 'Deanna Bloom', 'Bob Parker', 'Mark Hermes'],
        docents: ['Rich', 'Susan', 'Tony', 'Gailynne'],
        interiors: ['Bec Freeman', 'Lois Hensel']
      };

      const dutyLabels = {
        construction: 'Construction',
        board: 'Board Member',
        landscape: 'Grounds',
        docents: 'Docent',
        interiors: 'Interiors',
        other: 'Other'
      };

      useEffect(() => {
        loadLogs();
      }, []);

      const loadLogs = () => {
        try {
          const stored = localStorage.getItem('volunteer-logs');
          if (stored) {
            setLogs(JSON.parse(stored));
          }
        } catch (error) {
          console.log('No existing logs found');
        }
      };

      const saveLogs = (newLogs) => {
        try {
          localStorage.setItem('volunteer-logs', JSON.stringify(newLogs));
          setLogs(newLogs);
        } catch (error) {
          console.error('Error saving logs:', error);
        }
      };

      const sendToGoogleSheet = async (entry) => {
        try {
          let url = '';
          if (entry.type === 'volunteer') {
            url = VOLUNTEER_SHEET_URL;
          } else if (entry.type === 'guest' || entry.type === 'comment') {
            url = GUEST_FEEDBACK_SHEET_URL;
          }

          if (url) {
            fetch(url, {
              redirect: 'follow',
              method: 'POST',
              headers: {
                'Content-Type': 'text/plain;charset=utf-8',
              },
              body: JSON.stringify(entry)
            }).catch(err => {
              console.log('Sent to Google Sheets');
            });
          }
        } catch (error) {
          console.error('Error sending to Google Sheets:', error);
        }
      };

      const addLog = (entry) => {
        const newLogs = [...logs, entry];
        saveLogs(newLogs);
        sendToGoogleSheet(entry);
      };

      const handleVolunteerAction = (action) => {
        const name = selectedVolunteer === 'other' ? customName : selectedVolunteer;
        const timestamp = new Date().toISOString();
        
        const entry = {
          timestamp,
          name,
          type: 'volunteer',
          duty: dutyLabels[selectedDuty],
          action
        };
        
        addLog(entry);
        
        if (action === 'check-out') {
          setScreen('checkout-confirmation');
        } else {
          setScreen('confirmation');
        }
        
        setTimeout(() => {
          resetToMain();
        }, 3000);
      };

      const handleGuestSubmit = () => {
        const timestamp = new Date().toISOString();
        
        const entry = {
          timestamp,
          name: guestData.name,
          type: 'guest',
          guests: guestData.guests,
          email: guestData.email,
          joinList: guestData.joinList,
          action: 'visit'
        };
        
        addLog(entry);
        setScreen('confirmation');
        setTimeout(() => {
          resetToMain();
        }, 2000);
      };

      const handleCommentSubmit = async () => {
        if (!commentText.trim()) return;
        
        const timestamp = new Date().toISOString();
        const entry = {
          timestamp,
          type: 'comment',
          comment: commentText,
          action: 'submitted'
        };
        
        addLog(entry);
        setScreen('confirmation');
        setTimeout(() => {
          resetToMain();
        }, 2000);
      };

      const resetToMain = () => {
        setScreen('main');
        setSelectedDuty(null);
        setSelectedVolunteer(null);
        setCustomName('');
        setGuestData({ name: '', guests: 1, email: '', joinList: false });
        setSelectedVolunteerForHours(null);
        setCommentText('');
      };

      const calculateMonthlyHours = (volunteerName) => {
        const now = new Date();
        const currentMonth = now.getMonth();
        const currentYear = now.getFullYear();
        
        const volunteerLogs = logs.filter(log => 
          log.name === volunteerName && 
          log.type === 'volunteer' &&
          new Date(log.timestamp).getMonth() === currentMonth &&
          new Date(log.timestamp).getFullYear() === currentYear
        );

        const entries = [];
        let totalHours = 0;
        
        for (let i = 0; i < volunteerLogs.length; i++) {
          const log = volunteerLogs[i];
          
          if (log.action === 'check-in') {
            const checkOut = volunteerLogs.find((l, idx) => 
              idx > i && l.action === 'check-out' && l.name === volunteerName
            );
            
            const checkInTime = new Date(log.timestamp);
            const checkOutTime = checkOut ? new Date(checkOut.timestamp) : null;
            
            let hours = 0;
            let hoursDisplay = '';
            let checkOutDisplay = '';
            
            if (checkOutTime) {
              hours = (checkOutTime - checkInTime) / (1000 * 60 * 60);
              hoursDisplay = hours.toFixed(1);
              checkOutDisplay = checkOutTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
              totalHours += hours;
            } else {
              const today = new Date();
              const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());
              const isToday = checkInTime >= todayStart;
              
              if (isToday && (Date.now() - checkInTime.getTime()) < (12 * 60 * 60 * 1000)) {
                hoursDisplay = 'In Progress';
                checkOutDisplay = 'Still Checked In';
              } else {
                hours = 4;
                hoursDisplay = '4.0 (assumed)';
                checkOutDisplay = 'Missing (4hrs assumed)';
                totalHours += hours;
              }
            }
            
            entries.push({
              date: checkInTime.toLocaleDateString(),
              checkIn: checkInTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              checkOut: checkOutDisplay,
              duty: log.duty,
              hours: hoursDisplay
            });
          } else if (log.action === 'check-out') {
            const hasCheckIn = volunteerLogs.find((l, idx) => 
              idx < i && l.action === 'check-in' && l.name === volunteerName
            );
            
            if (!hasCheckIn) {
              const checkOutTime = new Date(log.timestamp);
              totalHours += 4;
              entries.push({
                date: checkOutTime.toLocaleDateString(),
                checkIn: 'Missing',
                checkOut: checkOutTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                duty: log.duty,
                hours: '4.0 (assumed)'
              });
            }
          }
        }
        
        return { totalHours: totalHours.toFixed(1), entries };
      };

      const getAllVolunteerNames = () => {
        const allNames = new Set();
        Object.values(dutyAreas).forEach(names => {
          names.forEach(name => allNames.add(name));
        });
        return Array.from(allNames).sort();
      };

      // Main Menu
      if (screen === 'main') {
        return React.createElement('div', { className: "min-h-screen bg-stone-50 p-8 flex items-center justify-center" },
          React.createElement('div', { className: "max-w-2xl mx-auto w-full" },
            React.createElement('div', { className: "text-center mb-16" },
              React.createElement('div', { 
                className: "w-20 h-20 mx-auto mb-8 rounded-full flex items-center justify-center",
                style: { backgroundColor: '#886c44' }
              },
                React.createElement('div', { className: "text-white text-4xl" }, '✦')
              ),
              React.createElement('h1', { className: "text-5xl font-serif text-stone-800 mb-4 font-semibold" }, 'Check into the North Star House!'),
              React.createElement('p', { className: "text-xl text-stone-600" }, 'Quick access to all check-in features')
            ),
            React.createElement('div', { className: "space-y-6" },
              React.createElement('button', {
                onClick: () => setScreen('duty-select'),
                className: "w-full bg-white hover:bg-stone-100 text-stone-800 p-8 rounded-full border-2 border-stone-300 text-2xl font-semibold shadow-sm hover:shadow-md transition-all flex items-center gap-4"
              },
                React.createElement('div', { className: "w-12 h-12 bg-green-100 rounded-full flex items-center justify-center flex-shrink-0" },
                  React.createElement(Clock, { size: 24 })
                ),
                React.createElement('span', { className: "flex-1 text-left" }, 'Volunteer Sign In & Out')
              ),
              React.createElement('button', {
                onClick: () => setScreen('guest'),
                className: "w-full bg-white hover:bg-stone-100 text-stone-800 p-8 rounded-full border-2 border-stone-300 text-2xl font-semibold shadow-sm hover:shadow-md transition-all flex items-center gap-4"
              },
                React.createElement('div', { className: "w-12 h-12 bg-red-100 rounded-full flex items-center justify-center flex-shrink-0" },
                  React.createElement(Users, { size: 24 })
                ),
                React.createElement('span', { className: "flex-1 text-left" }, 'Guest Registration & Check In')
              ),
              React.createElement('button', {
                onClick: () => setScreen('other'),
                className: "w-full bg-white hover:bg-stone-100 text-stone-800 p-8 rounded-full border-2 border-stone-300 text-2xl font-semibold shadow-sm hover:shadow-md transition-all flex items-center gap-4"
              },
                React.createElement('div', { className: "w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center flex-shrink-0" },
                  React.createElement(ClipboardList, { size: 24 })
                ),
                React.createElement('span', { className: "flex-1 text-left" }, 'Other')
              )
            )
          )
        );
      }

      // For now, return a simple "under construction" message for other screens
      return React.createElement('div', { className: "min-h-screen bg-stone-50 p-8 flex items-center justify-center" },
        React.createElement('div', { className: "text-center" },
          React.createElement('h2', { className: "text-3xl font-serif text-stone-800 mb-4" }, 'Feature in Development'),
          React.createElement('button', {
            onClick: resetToMain,
            className: "bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-4 rounded-full text-xl font-semibold"
          }, 'Back to Main Menu')
        )
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(NorthStarKiosk));
  </script>
</body>
</html>
